
# =================================================================
#  CONFIGURATION NGINX RECOMMANDÉE POUR STREAMMG
# =================================================================
# À copier dans votre fichier de configuration serveur
# (ex: /etc/nginx/sites-available/default ou /etc/nginx/snippets/streammg.conf)
#
# Cette configuration gère le reverse proxy vers l'application Node.js
# et corrige les problèmes de chemin pour les cookies et les requêtes HLS.
# =================================================================

# -----------------------------------------------------------------
# BLOC PRINCIPAL POUR L'APPLICATION STREAMMG
# -----------------------------------------------------------------
# Ce bloc intercepte toutes les requêtes commençant par /streammg/
location /streammg/ {
    # --- Reverse Proxy vers Node.js (port 8100) ---
    proxy_pass http://localhost:8100/; # Le "/" final est crucial

    # --- CORRECTION CRUCIALE POUR LES COOKIES ---
    # Réécrit le `Path` des cookies du backend (qui pense être à la racine)
    # pour qu'ils soient valides pour l'ensemble du sous-dossier /streammg/.
    # EX: "Path=/" devient "Path=/streammg/". Si le backend envoie "Path=/api",
    # il deviendra "Path=/streammg/api".
    # Note : Si le backend est bien configuré (sans `path` restrictif),
    # proxy_cookie_path / /streammg/; est la solution la plus robuste.
    # On met les deux pour couvrir tous les cas.
    proxy_cookie_path / /streammg/;
    proxy_cookie_path /api /streammg/api;

    # --- Configuration des headers pour Node.js ---
    # Assure que le backend reçoit les bonnes informations (IP, protocole, etc.)
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade"; # Pour WebSocket si utilisé
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # --- Paramètres importants ---
    proxy_buffering off; # Recommandé pour les applications temps-réel/streaming
    proxy_request_buffering off; # Important pour la réactivité
    proxy_cache_bypass $http_upgrade;

    # --- Taille max pour les uploads de vidéos ---
    client_max_body_size 500M;
}

# -----------------------------------------------------------------
# BLOC SPÉCIFIQUE POUR LES FICHIERS HLS
# -----------------------------------------------------------------
# Ce bloc est nécessaire pour que les requêtes directes vers les
# fichiers .ts et .m3u8 fonctionnent correctement.
# Il hérite de la configuration du bloc principal mais ajoute des
# headers spécifiques au streaming.
location /streammg/hls/ {
    proxy_pass http://localhost:8100/hls/;

    # --- Headers du bloc principal (répétés pour la spécificité) ---
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # --- Optimisations pour le streaming HLS ---
    # Dit à Nginx de ne pas fermer la connexion prématurément
    proxy_read_timeout 120s;
    proxy_connect_timeout 120s;

    # Mise en cache des segments vidéo côté client pour fluidifier la lecture
    # Les manifestes (.m3u8) ne sont jamais mis en cache.
    add_header 'Cache-Control' 'no-cache, no-store, must-revalidate' always;
    if ($request_uri ~* \.ts$) {
        add_header 'Cache-Control' 'public, max-age=31536000, immutable';
    }

    # --- Ne pas oublier la correction des cookies ici aussi ---
    proxy_cookie_path / /streammg/;
    proxy_cookie_path /api /streammg/api;
}

